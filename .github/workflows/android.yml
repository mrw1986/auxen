name: Android CI

on:
  push:
    branches: [main]
    paths: ["android/**", ".github/workflows/android.yml"]
  pull_request:
    paths: ["android/**", ".github/workflows/android.yml"]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Unit tests
        working-directory: android
        run: ./gradlew testDebugUnitTest --stacktrace

      - name: Roborazzi verification
        working-directory: android
        run: ./gradlew verifyRoborazziDebug --stacktrace

      - name: Upload Roborazzi diffs
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: roborazzi-diffs
          path: android/app/build/outputs/roborazzi/
          if-no-files-found: ignore

      - name: Build debug APK
        working-directory: android
        run: ./gradlew assembleDebug --stacktrace

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: auxen-debug-apk
          path: android/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error

  emulator-smoke:
    runs-on: ubuntu-latest
    needs: build
    # Required since 2026-07-12 after two consecutive green runs
    # (29207916463, 29208254002). If emulator flakiness ever becomes chronic,
    # prefer fixing the flake source over re-adding continue-on-error.
    steps:
      - uses: actions/checkout@v4

      # setup-java gives the emulator action a known JDK for its sdkmanager calls.
      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      # Reuse the exact APK the build job tested — no second Gradle build.
      - name: Download debug APK
        uses: actions/download-artifact@v4
        with:
          name: auxen-debug-apk
          path: apk

      # Embed a title so the on-device track name is deterministic
      # ("Smoke Tone") regardless of MediaStore's filename-to-title heuristics.
      # ubuntu-latest (24.04) does not preinstall ffmpeg.
      - name: Generate test tone MP3
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg
          ffmpeg -f lavfi -i "sine=frequency=440:duration=10" \
            -metadata title="Smoke Tone" -metadata artist="Auxen QA" \
            -y smoke-tone.mp3

      - name: Install Maestro
        run: curl -fsSL https://get.maestro.mobile.dev | bash

      - name: Run smoke flow on emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          arch: x86_64
          target: google_apis
          disable-animations: true
          script: |
            adb install -r apk/app-debug.apk
            # Pre-grant so no runtime permission dialog blocks the flow.
            adb shell pm grant io.github.auxen android.permission.READ_MEDIA_AUDIO
            adb shell pm grant io.github.auxen android.permission.POST_NOTIFICATIONS
            # Seed local media (emulator has none by default) and index it.
            adb shell mkdir -p /sdcard/Music
            adb push smoke-tone.mp3 /sdcard/Music/smoke-tone.mp3
            # API 30+ media indexing: MediaProvider's scan_file content call
            # ("cmd media scan" has no such service on modern images); legacy
            # broadcast kept as a harmless belt-and-suspenders fallback.
            adb shell content call --uri content://media/ --method scan_file --arg /sdcard/Music/smoke-tone.mp3 || true
            adb shell am broadcast -a android.intent.action.MEDIA_SCANNER_SCAN_FILE -d file:///sdcard/Music/smoke-tone.mp3 || true
            # Deterministic gate: wait until MediaStore actually indexed the
            # tone. NOTE: android-emulator-runner executes this script input
            # LINE BY LINE (each line its own sh -c), so shell constructs must
            # fit on one physical line.
            for i in $(seq 1 20); do adb shell content query --uri content://media/external/audio/media --projection title 2>/dev/null | grep -q "Smoke Tone" && break; sleep 2; done
            adb shell content query --uri content://media/external/audio/media --projection title | grep "Smoke Tone"
            # Absolute path: each script line runs in its own sh, so an
            # earlier `export PATH` line would not reach this one. The
            # touch-file trick lets later lines run (env vars don't survive
            # between per-line shells) so diagnostics upload on failure, while
            # the final `test` line preserves the pass/fail signal.
            $HOME/.maestro/bin/maestro test --debug-output "$GITHUB_WORKSPACE/maestro-debug" android/maestro/smoke.yaml || touch /tmp/maestro_failed
            # Runtime proof PlaybackService.onCreate()'s media-notification wiring
            # (DefaultMediaNotificationProvider + ic_stat_auxen) actually works: the
            # flow's last step tapped "Smoke Tone" to start playback, so the resulting
            # MediaStyle notification should now be posted for our package. Retry loop
            # covers the small gap between the flow exiting and NotificationManager
            # finishing the post; final line is the authoritative check + failure gate.
            for i in $(seq 1 10); do adb shell dumpsys notification | grep -q io.github.auxen && break; sleep 1; done
            adb shell dumpsys notification | grep -q io.github.auxen || touch /tmp/maestro_failed
            ls -laR "$GITHUB_WORKSPACE/maestro-debug" maestro-shots "$HOME/.maestro" 2>&1 | head -60 || true
            cp -r maestro-shots "$GITHUB_WORKSPACE/maestro-debug-shots" 2>/dev/null || true
            test ! -f /tmp/maestro_failed

      - name: Upload Maestro debug output
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: maestro-debug
          # Maestro's default output dir is the reliable source of failure
          # screenshots + UI hierarchies; the --debug-output dir is kept as
          # a secondary in case a newer CLI honors it differently.
          path: |
            maestro-debug/
            maestro-debug-shots/
            maestro-shots/
            ~/.maestro/tests/
          if-no-files-found: ignore
