# Tier-2 emulator smoke flow — runs on a real emulator only (not JVM/Robolectric).
#
# Purpose: catch a broken build that unit + Roborazzi tests can't. Every step
# asserts something a real regression would break — app launch, full bottom-nav
# navigation, on-device media loading, and (the carry-forward from Task 2) the
# new-playlist create path: an AlertDialog + OutlinedTextField that hangs under
# Robolectric and is therefore JVM-unverifiable.
#
# CI prerequisites (see .github/workflows/android.yml → emulator-smoke):
#   - READ_MEDIA_AUDIO + POST_NOTIFICATIONS granted via `adb shell pm grant`
#   - /sdcard/Music/smoke-tone.mp3 pushed + `cmd media scan`ed so the local
#     provider surfaces a track titled "Smoke Tone".
appId: io.github.auxen
---
# App launches and the top-bar chrome renders.
- launchApp
- assertVisible: "Auxen"

# Home is the start destination — the time-of-day greeting proves HomeScreen composed.
- assertVisible:
    text: "Good (morning|afternoon|evening)"

# Bottom-nav navigation across the other tabs; each asserts screen-unique text.
- tapOn: "Search"
- assertVisible: "Search local + Tidal"
- tapOn: "Collection"
- assertVisible: "Playlists"

# Library → Tracks: the pushed test tone must appear (media scan + READ_MEDIA_AUDIO).
- tapOn: "Library"
- tapOn: "Tracks"
- assertVisible: "Smoke Tone"

# New-playlist create path (JVM-unverifiable): long-press → Add to playlist →
# New playlist… → type a name → Create.
- longPressOn: "Smoke Tone"
- assertVisible: "Add to playlist"
- tapOn: "Add to playlist"
- tapOn: "New playlist…"
- assertVisible: "New playlist"    # AlertDialog title
- tapOn: "Name"                    # focus the OutlinedTextField
- inputText: "Smoke Playlist"
- tapOn: "Create"

# The new playlist now shows up under Collection → Playlists.
- tapOn: "Collection"
- tapOn: "Playlists"
- assertVisible: "Smoke Playlist"
